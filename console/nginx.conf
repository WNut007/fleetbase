server {
    listen       4200;
    server_name  localhost;

    root /usr/share/nginx/html;

    # The console ships ~15 MB of JavaScript; compressed it is a fraction of that.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Fingerprinted build output (name-<hash>.js, chunk.<id>.<hash>.js): the name changes
    # whenever the content does, so the browser can keep it and never ask again.
    location ~* "^/(assets|engines-dist)/.*[.-][0-9a-f]{16,}\.(js|css|map|json|svg|png|jpg|woff2?|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files: cache, but check for a newer version on each visit.
    location ~* "^/(assets|engines-dist|images|fonts|favicon)/" {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location / {
        # index.html names the current fingerprinted files, so it must never be stale.
        add_header Cache-Control "no-cache";
        # Allows the opt-in boot profiler in index.html (JS Self-Profiling API); no cost unless it is used.
        add_header Document-Policy "js-profiling";
        try_files $uri $uri/ /index.html =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
